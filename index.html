<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090812">
<meta name="description" content="NEXO Digital Store">
<title>NEXO</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#080711;
  --bg2:#0d0b18;
  --card:#131020;
  --card2:#18142a;
  --border:#29233d;
  --purple:#8b5cf6;
  --purple2:#a855f7;
  --pink:#ec4899;
  --text:#fff;
  --muted:#9690aa;
  --green:#35d07f;
  --red:#ff5577;
  --gold:#ffc857;
  --shadow:0 15px 40px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Vazirmatn,Arial,sans-serif;
  min-height:100%;
}

body{
  padding-bottom:90px;
  overflow-x:hidden;
}

button,input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:14px;
}

/* TOP */
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logoIcon{
  width:44px;
  height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:22px;
  font-weight:900;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  box-shadow:0 8px 25px rgba(139,92,246,.3);
}

.logoText{
  font-weight:900;
  font-size:20px;
  letter-spacing:1px;
}

.logoSub{
  color:var(--muted);
  font-size:10px;
  margin-top:-2px;
}

.topActions{
  display:flex;
  gap:8px;
}

.iconBtn{
  width:42px;
  height:42px;
  border-radius:13px;
  background:var(--card);
  color:white;
  border:1px solid var(--border);
  font-size:18px;
}

/* VIEWS */
.view{
  display:none;
}

.view.active{
  display:block;
}

/* HERO */
.hero{
  position:relative;
  overflow:hidden;
  min-height:185px;
  border-radius:24px;
  padding:22px;
  margin-bottom:15px;
  background:
    radial-gradient(circle at 90% 10%,rgba(168,85,247,.38),transparent 35%),
    radial-gradient(circle at 10% 100%,rgba(236,72,153,.2),transparent 40%),
    linear-gradient(135deg,#171127,#0e0b18);
  border:1px solid #30274a;
  box-shadow:var(--shadow);
}

.hero:after{
  content:"NEXO";
  position:absolute;
  left:-12px;
  bottom:-28px;
  font-size:100px;
  font-weight:900;
  color:rgba(255,255,255,.025);
  pointer-events:none;
}

.heroBadge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:20px;
  background:rgba(139,92,246,.14);
  color:#c8b5ff;
  border:1px solid rgba(139,92,246,.25);
  font-size:11px;
  margin-bottom:10px;
}

.hero h1{
  margin:0;
  font-size:28px;
  line-height:1.3;
}

.hero p{
  color:var(--muted);
  font-size:12px;
  margin:7px 0 17px;
}

.heroBtn{
  position:relative;
  z-index:2;
  padding:12px 18px;
  border-radius:13px;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  box-shadow:0 8px 22px rgba(139,92,246,.25);
}

/* SECTION */
.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 2px 11px;
}

.sectionTitle h2{
  margin:0;
  font-size:16px;
}

.sectionTitle span{
  color:var(--muted);
  font-size:11px;
}

/* SEARCH */
.search{
  display:flex;
  align-items:center;
  gap:9px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:0 13px;
  height:48px;
  margin-bottom:14px;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:13px;
}

.search input::placeholder{
  color:#6f687f;
}

/* CATEGORIES */
.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  white-space:nowrap;
  padding:9px 13px;
  border-radius:12px;
  background:var(--card);
  border:1px solid var(--border);
  color:#aaa3bb;
  font-size:11px;
}

.cat.active{
  color:white;
  border-color:var(--purple);
  background:rgba(139,92,246,.17);
}

/* PRODUCT GRID */
.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.product{
  position:relative;
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--border);
  border-radius:18px;
  padding:12px;
  min-width:0;
  transition:.18s;
}

.product:active{
  transform:scale(.98);
}

.productIcon{
  height:88px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:42px;
  margin-bottom:10px;
  background:
    radial-gradient(circle,rgba(139,92,246,.3),transparent 55%),
    #0d0a17;
  border:1px solid #27203b;
}

.productTitle{
  font-size:13px;
  font-weight:800;
  margin-bottom:4px;
}

.productDesc{
  color:var(--muted);
  font-size:10px;
  min-height:17px;
}

.productBottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:5px;
  margin-top:11px;
}

.price{
  font-size:12px;
  font-weight:800;
}

.price small{
  color:var(--muted);
  font-size:9px;
  font-weight:500;
}

.buy{
  padding:8px 10px;
  border-radius:10px;
  background:rgba(139,92,246,.18);
  color:#d8caff;
  border:1px solid rgba(139,92,246,.28);
  font-size:10px;
  font-weight:800;
}

/* WALLET */
.wallet{
  background:
    radial-gradient(circle at 90% 10%,rgba(236,72,153,.3),transparent 35%),
    linear-gradient(135deg,#19132d,#0f0c19);
  border:1px solid #33264e;
  border-radius:23px;
  padding:20px;
  box-shadow:var(--shadow);
}

.walletLabel{
  color:#aaa2ba;
  font-size:11px;
}

.walletBalance{
  font-size:30px;
  font-weight:900;
  margin:7px 0 3px;
}

.walletUnit{
  color:#9c91b2;
  font-size:10px;
}

.walletActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:17px;
}

.walletActions button{
  padding:12px;
  border-radius:13px;
  color:white;
  font-size:11px;
  font-weight:800;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.09);
}

/* PROFILE */
.profile{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:21px;
  padding:18px;
}

.profileHead{
  display:flex;
  align-items:center;
  gap:13px;
}

.avatar{
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  border-radius:18px;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  font-size:24px;
  font-weight:900;
}

.profileName{
  font-size:16px;
  font-weight:900;
}

.profileUsername{
  color:var(--muted);
  font-size:11px;
  direction:ltr;
  text-align:right;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:var(--green);
  font-size:10px;
  margin-top:5px;
}

.status i{
  width:6px;
  height:6px;
  background:var(--green);
  border-radius:50%;
}

/* ORDERS */
.order{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  margin-bottom:8px;
}

.orderIcon{
  width:44px;
  height:44px;
  border-radius:13px;
  background:#0e0b18;
  display:grid;
  place-items:center;
  font-size:22px;
}

.orderInfo{
  flex:1;
  min-width:0;
}

.orderName{
  font-size:12px;
  font-weight:800;
}

.orderDate{
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
}

.orderStatus{
  font-size:9px;
  padding:5px 8px;
  border-radius:8px;
  color:#b9ffd9;
  background:rgba(53,208,127,.1);
}

/* EMPTY */
.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.emptyIcon{
  font-size:42px;
  margin-bottom:8px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  justify-content:center;
  backdrop-filter:blur(5px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(620px,100%);
  background:#11101b;
  border:1px solid #302a43;
  border-bottom:0;
  border-radius:25px 25px 0 0;
  padding:18px;
  max-height:88vh;
  overflow:auto;
  animation:up .2s ease;
}

@keyframes up{
  from{transform:translateY(30px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

  font-size:
