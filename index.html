<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090813">
<title>AniStorm Shop</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap');

:root {
  --bg: #090813;
  --card: #171426;
  --purple: #9b5cff;
  --pink: #ed65dc;
  --text: #f8f5ff;
  --muted: #a8a1bd;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(ellipse at 90% 0%, #40206b55, transparent 45%),
    radial-gradient(ellipse at 0% 45%, #5d1b6650, transparent 35%),
    var(--bg);
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  min-height: 100vh;
  padding-bottom: 100px;
}

button { font: inherit; cursor: pointer; }

.container {
  max-width: 540px;
  margin: auto;
  padding: 20px 16px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 25px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: linear-gradient(135deg, #a45bff, #ed65dc);
  font-size: 25px;
  box-shadow: 0 0 25px #a45bff44;
}

.brand h2 { margin: 0; font-size: 17px; }
.brand p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #211b35;
  border: 1px solid #493567;
}

.hero {
  padding: 25px 21px;
  border: 1px solid #a45bff55;
  border-radius: 25px;
  background: linear-gradient(130deg, #38205e, #171126 65%, #301536);
  position: relative;
  overflow: hidden;
  margin-bottom: 25px;
}

.hero::after {
  content: "✦";
  position: absolute;
  left: 18px;
  top: 8px;
  font-size: 100px;
  color: #ffffff0c;
}

.tag {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 30px;
  background: #ffffff12;
  color: #e1caff;
  font-size: 11px;
}

.hero h1 {
  font-size: 27px;
  line-height: 1.6;
  margin: 12px 0 5px;
}

.hero p {
  color: #c4bad9;
  font-size: 13px;
  line-height: 2;
  margin: 0 0 17px;
}

.primary {
  border: 0;
  color: white;
  padding: 11px 19px;
  border-radius: 13px;
  font-weight: 700;
  background: linear-gradient(100deg, #8b4dff, #c04fe0);
  box-shadow: 0 5px 22px #974dff30;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 23px 0 13px;
}

.section-head h3 { margin: 0; font-size: 17px; }
.section-head span { font-size: 11px; color: var(--muted); }

.categories {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding-bottom: 7px;
  scrollbar-width: none;
}

.category {
  flex-shrink: 0;
  padding: 10px 15px;
  border-radius: 14px;
  color: #c9c1d9;
  border: 1px solid #ffffff12;
  background: #171426;
  font-size: 12px;
}

.category.active {
  color: white;
  background: #7843bc;
  border-color: #b98aff;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.product {
  min-width: 0;
  padding: 13px;
  border-radius: 20px;
  background: linear-gradient(145deg, #211a32, #12101e);
  border: 1px solid #ffffff12;
  box-shadow: 0 8px 25px #00000018;
}

.product-art {
  height: 105px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 43px;
  background:
    radial-gradient(circle at 50% 40%, #a55aff55, transparent 65%),
    #171126;
  border: 1px solid #ffffff0b;
  margin-bottom: 12px;
}

.product h4 { margin: 0 0 5px; font-size: 14px; }
.product p {
  margin: 0 0 13px;
  color: var(--muted);
  font-size: 11px;
  min-height: 22px;
}

.product-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
}

.price { font-size: 12px; font-weight: 700; }
.price small { color: #b7a8d5; font-weight: 400; }

.buy {
  border: 1px solid #a45bff70;
  background: #8b4dff20;
  color: #d9bcff;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 11px;
}

.note {
  margin-top: 20px;
  padding: 13px;
  border: 1px solid #ffffff12;
  background: #ffffff05;
  color: var(--muted);
  border-radius: 15px;
  font-size: 11px;
  line-height: 2;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 5;
  display: flex;
  justify-content: space-around;
  padding: 12px 5px calc(12px + env(safe-area-inset-bottom));
  background: #100d1bf2;
  border-top: 1px solid #ffffff12;
  backdrop-filter: blur(18px);
}

.nav-item {
  color: #89819f;
  border: 0;
  background: none;
  display: grid;
  justify-items: center;
  gap: 4px;
  font-size: 10px;
}

.nav-item b { font-size: 20px; }
.nav-item.active { color: #c99aff; }

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 35px 10px;
  color: var(--muted);
}

@media (max-width: 350px) {
  .product { padding: 9px; }
  .hero h1 { font-size: 23px; }
}
</style>
</head>

<body>
<div class="container">

  <header>
    <div class="brand">
      <div class="logo">⚡</div>
      <div>
        <h2>AniStorm Shop</h2>
        <p>دنیای گیفت و استارز</p>
      </div>
    </div>
    <div class="avatar">👤</div>
  </header>

  <section class="hero">
    <span class="tag">✦ فروشگاه دیجیتال</span>
    <h1>قدرت خریدت رو<br>آزاد کن!</h1>
    <p>استارز، گیفت و آیتم‌های خاص تلگرام<br>همه در یک فروشگاه.</p>
    <button class="primary" onclick="showProducts()">
      مشاهده محصولات ←
    </button>
  </section>

  <div class="section-head">
    <h3>دسته‌بندی‌ها</h3>
    <span>محصولات فروشگاه</span>
  </div>

  <div class="categories">
    <button class="category active" data-cat="all">همه</button>
    <button class="category" data-cat="stars">⭐ استارز</button>
    <button class="category" data-cat="gifts">🎁 گیفت‌ها</button>
    <button class="category" data-cat="nft">💎 کلکسیونی</button>
  </div>

  <div class="section-head" id="products">
    <h3>محصولات ویژه</h3>
    <span id="count">۶ محصول</span>
  </div>

  <div class="products" id="product-list"></div>

  <div class="note">
    ✦ این نسخه نمایشی است. قیمت‌ها نمونه هستند و خرید واقعی
    یا تحویل محصول هنوز فعال نشده است.
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="navTo('home',this)">
    <b>⌂</b>خانه
  </button>
  <button class="nav-item" onclick="navTo('products',this)">
    <b>▦</b>محصولات
  </button>
  <button class="nav-item" onclick="demo('سفارش‌های من')">
    <b>▤</b>سفارش‌ها
  </button>
  <button class="nav-item" onclick="demo('پروفایل')">
    <b>♙</b>پروفایل
  </button>
</nav>

<script>
const products = [
  {id:1, cat:"stars", icon:"⭐", name:"۱۰۰ استارز", desc:"پکیج استارز تلگرام", price:"نمونه"},
  {id:2, cat:"stars", icon:"🌟", name:"۵۰۰ استارز", desc:"پکیج استارز تلگرام", price:"نمونه"},
  {id:3, cat:"gifts", icon:"🎁", name:"گیفت تلگرام", desc:"هدیه دیجیتال", price:"نمونه"},
  {id:4, cat:"gifts", icon:"🌹", name:"گیفت رز", desc:"گیفت تلگرامی", price:"نمونه"},
  {id:5, cat:"nft", icon:"💎", name:"گیفت کلکسیونی", desc:"Collectible Gift", price:"نمونه"},
  {id:6, cat:"nft", icon:"🎨", name:"آیتم ویژه", desc:"آیتم دیجیتال", price:"نمونه"}
];

const list = document.getElementById("product-list");
const count = document.getElementById("count");

function render(cat="all") {
  const items = cat === "all"
    ? products
    : products.filter(p => p.cat === cat);

  count.textContent = items.length + " محصول";

  if (!items.length) {
    list.innerHTML = '<div class="empty">محصولی پیدا نشد.</div>';
    return;
  }

  list.innerHTML = items.map(p => `
    <article class="product">
      <div class="product-art">${p.icon}</div>
      <h4>${p.name}</h4>
      <p>${p.desc}</p>
      <div class="product-bottom">
        <div class="price">${p.price}<br><small>قیمت نمایشی</small></div>
        <button class="buy" onclick="buy(${p.id})">جزئیات</button>
      </div>
    </article>
  `).join("");
}

document.querySelectorAll(".category").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".category")
      .forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render(btn.dataset.cat);
  });
});

function buy(id) {
  const p = products.find(x => x.id === id);
  alert("محصول: " + p.name +
    "\nاین نسخه آزمایشی است؛ خرید هنوز فعال نیست.");
}

function showProducts() {
  document.getElementById("products")
    .scrollIntoView({behavior:"smooth"});
}

function navTo(where, btn) {
  document.querySelectorAll(".nav-item")
    .forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  if (where === "home") {
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    showProducts();
  }
}

function demo(name) {
  alert(name + "\nاین بخش در نسخه بعدی فعال می‌شود.");
}

render();
</script>
</body>
</html>
